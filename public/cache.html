<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Erebus Portal — Purging Cache</title>
  <link rel="icon" type="image/png" href="/img/favicon-32.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0e0e0e;
      color: #e5e2e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #191818;
      border: 1px solid #381a1e;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(138, 15, 26, 0.2);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: block;
      filter: drop-shadow(0 0 12px rgba(180, 15, 31, 0.4));
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.6rem;
      color: #ffb3ae;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #a39e9e;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-list {
      background: #121212;
      border: 1px solid #282727;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 0.88rem;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      color: #c9c5c5;
    }
    .status-item:not(:last-child) {
      border-bottom: 1px solid #1c1c1c;
    }
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      font-size: 13px;
      border-radius: 50%;
    }
    .icon.success {
      background: rgba(46, 125, 50, 0.2);
      color: #81c784;
    }
    .icon.pending {
      background: rgba(255, 179, 174, 0.1);
      color: #ffb3ae;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .action-btn {
      background: #8a0f1a;
      color: #fff;
      border: 1px solid #b40f1f;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(138, 15, 26, 0.4);
    }
    .action-btn:hover {
      background: #a31422;
      box-shadow: 0 6px 20px rgba(180, 15, 31, 0.6);
      transform: translateY(-1px);
    }
    .action-btn:active {
      transform: translateY(0);
    }
    .countdown {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #7d7878;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/img/ATT-logo(1).webp" alt="ATT Logo" class="logo" />
    <h1>Purging Portal Cache</h1>
    <p class="subtitle">Clearing stored client assets, service workers, and local data...</p>

    <div class="status-list" id="statusList">
      <div class="status-item" id="item-cache">
        <span class="icon pending" id="icon-cache">⏳</span>
        <span id="text-cache">Purging Cache Storage...</span>
      </div>
      <div class="status-item" id="item-sw">
        <span class="icon pending" id="icon-sw">⏳</span>
        <span id="text-sw">Unregistering Service Workers...</span>
      </div>
      <div class="status-item" id="item-storage">
        <span class="icon pending" id="icon-storage">⏳</span>
        <span id="text-storage">Flushing Session &amp; Local Storage...</span>
      </div>
      <div class="status-item" id="item-idb">
        <span class="icon pending" id="icon-idb">⏳</span>
        <span id="text-idb">Clearing IndexedDB Databases...</span>
      </div>
    </div>

    <a href="/" class="action-btn" id="returnBtn">Enter the Court Now</a>
    <div class="countdown" id="countdown">Redirecting automatically in 3 seconds...</div>
  </div>

  <script src="/cache-purge.js"></script>
</body>
</html>
