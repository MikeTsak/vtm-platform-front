       gtag.js tag below.

       GA4 is the one script here that's fine to load unconditionally: it
       implements Google Consent Mode v2, and analytics-init.js sets every
       consent signal to 'denied' before gtag.js ever runs — no cookies are
       set and no personal data is processed until CookieConsent.jsx calls
       updateConsent(true). That's Google's own documented compliant
       pattern; blocking gtag.js entirely would actually break it (Consent
       Mode needs the tag present to send anonymous, cookieless pings before
       consent). AdSense and Microsoft Clarity do NOT have an equivalent
       default-denied mode, so — unlike GA — those two are not loaded here
       at all; see src/utils/consentGatedScripts.js, which CookieConsent.jsx
       only calls once consent is actually granted. -->
  <script src="/analytics-init.js"></script>
